name: war-probe

# One-off look at the community Helldivers 2 API (what the companion apps use):
# current war, Major Orders, active campaigns, planet hazards. Read-only.

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/war-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe api.helldivers2.dev
        run: |
          H1="X-Super-Client: warmind (github.com/haidetj/warmind)"
          H2="X-Super-Contact: github.com/haidetj/warmind/issues"
          for ep in war assignments campaigns; do
            echo "=================== /api/v1/$ep"
            curl -s -w "\nHTTP %{http_code}\n" -H "$H1" -H "$H2" "https://api.helldivers2.dev/api/v1/$ep" -o /tmp/$ep.json; cat /tmp/$ep.json | head -c 2500; echo
          done
          echo "=================== campaign planet sample (first 2)"
          python3 - <<'PY'
          import json
          c = json.load(open("/tmp/campaigns.json"))
          print(type(c), len(c) if isinstance(c, list) else "")
          for x in (c[:2] if isinstance(c, list) else []):
              print(json.dumps(x, indent=1)[:2500])
          PY
