name: war-probe

# Runs WARMIND's war feed parser (app/war.py) against the live community
# Helldivers 2 API (what the companion apps use): Major Orders, active
# campaigns, planet hazards. Read-only; on demand or when the parser changes.

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/war-probe.yml", "app/war.py"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pyyaml
      - name: Parse the live war feed
        working-directory: app
        run: |
          python3 - <<'PY'
          import json, war
          w = war.snapshot()
          print("ok:", w["ok"], "| error:", w.get("error"))
          print("orders:", json.dumps(w["orders"], indent=1)[:3000])
          raw = war._get("assignments")
          for a in raw:
              print("raw order:", a.get("title"), "|", (a.get("briefing") or "")[:200])
              for tk, pr in zip(a.get("tasks") or [], a.get("progress") or []):
                  print("   task type", tk.get("type"), "values", tk.get("values"), "valueTypes", tk.get("valueTypes"), "progress", pr)
          print("planets:", len(w["planets"]))
          for p in w["planets"][:40]:
              print(f'  {"*" if p["mo"] else " "} {p["name"]:<16} {p["enemy"]:<11} def={p["defense"]!s:<5} '
                    f'players={p["players"]:<6} lib={p["progress"]}% city={p["city"]} hz={p["hazards"]} raw={p["hazard_names"]}')
          unmapped = sorted({n for p in w["planets"] for n in p["hazard_names"]} - {n for p in w["planets"] for n, _ in []})
          import re
          from warmind import loader
          ours = {re.sub(r"[^a-z]", "", h["display_name"].lower()) for h in loader.hazards().values()}
          miss = sorted({n for p in w["planets"] for n in p["hazard_names"] if re.sub(r"[^a-z]", "", n.lower()).rstrip("s") not in {o.rstrip("s") for o in ours}})
          print("hazard names with no WARMIND mapping:", miss)
          assert w["ok"], "war feed failed"
          PY
      - name: Look for planet effects in the API (subfactions, Gloom, DSS, Weapons Experimentation)
        working-directory: app
        run: |
          python3 - <<'PY'
          import json, war, urllib.request
          def get(url):
              try:
                  req = urllib.request.Request(url, headers=war.HEADERS)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read().decode())
              except Exception as e:
                  return {"error": str(e)[:200]}
          camp = war._get("campaigns")
          p = (camp[0] or {}).get("planet", {}) if camp else {}
          print("campaign keys:", list((camp[0] or {}).keys()) if camp else None)
          print("planet keys:", list(p.keys()))
          print("first planet (trimmed):", json.dumps({k: v for k, v in p.items() if k not in ("waypoints", "position")}, indent=1)[:2500])
          for c in camp[:40]:
              pl = c.get("planet") or {}
              print("  ", pl.get("name"), "| biome:", (pl.get("biome") or {}).get("name"), "| hazards:", [h.get("name") for h in pl.get("hazards") or []],
                    "| effects:", pl.get("effects") or pl.get("activePlanetEffects") or pl.get("planetEffects"))
          base = war.BASE.replace("/api/v1/", "")
          for path in ("/api/v2/space-stations", "/api/v2/dispatches", "/raw/api/WarSeason/current/WarID", "/raw/api/WarSeason/801/Status"):
              d = get(base + path)
              txt = json.dumps(d)
              print("==", path, "| keys:", list(d.keys())[:30] if isinstance(d, dict) else type(d).__name__, "| len", len(txt))
              if isinstance(d, dict) and "planetActiveEffects" in d:
                  print("   planetActiveEffects sample:", json.dumps(d["planetActiveEffects"][:40]))
              elif isinstance(d, list):
                  print("   sample:", txt[:1500])
          PY
