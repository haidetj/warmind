name: data-verify

# Cross-checks items.yaml against the Helldivers 2 wiki (armor weight/passive,
# stratagem type, warbond, page exists). Fails on any mismatch, so a wrong
# classification can't merge. Runs on data changes, weekly, and on demand.

on:
  push:
    paths:
      - "app/warmind/data/items.yaml"
      - "sync/verify_wiki.py"
      - ".github/workflows/data-verify.yml"
  pull_request:
    paths:
      - "app/warmind/data/items.yaml"
      - "sync/verify_wiki.py"
  schedule:
    - cron: "17 15 * * 1"        # Mondays ~15:17 UTC: catch wiki-side corrections
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pyyaml
      - name: Verify items.yaml against the wiki
        id: verify
        run: python3 sync/verify_wiki.py          # refreshes sync/wiki_catalog.json, fails on any mismatch
      - name: Armour passive descriptions
        if: always()
        run: python3 sync/verify_wiki.py --passives
      - name: In-game menu layout + stratagem icons
        if: always()
        run: python3 sync/verify_wiki.py --armory
      - name: Commit refreshed catalog back to this branch
        if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add sync/wiki_catalog.json sync/passives_wiki.json app/warmind/data/armory.json app/static/icons app/static/img
          git diff --cached --quiet && exit 0
          git commit -m "data-verify: refresh wiki catalog"
          git pull --rebase -q && git push
