name: data-verify

# Cross-checks items.yaml against the Helldivers 2 wiki (armor weight/passive,
# stratagem type, warbond, page exists). Fails on any mismatch, so a wrong
# classification can't merge. Runs on data changes, weekly, and on demand.

on:
  push:
    paths:
      - "app/warmind/data/items.yaml"
      - "sync/verify_wiki.py"
      - ".github/workflows/data-verify.yml"
  pull_request:
    paths:
      - "app/warmind/data/items.yaml"
      - "sync/verify_wiki.py"
  schedule:
    - cron: "17 15 * * 1"        # Mondays ~15:17 UTC: catch wiki-side corrections
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pyyaml
      - name: Probe stratagem page formats
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, "sync")
          import verify_wiki as v
          for t in ["Eagle Airstrike", "Orbital Laser", "A/MG-43 Machine Gun Sentry", "LIFT-850 Jump Pack",
                    "EAT-17 Expendable Anti-Tank", "MLS-4X Commando", "FX-12 Shield Generator Relay", "EXO-45 Patriot Exosuit"]:
              title, text = v.wikitext(t)
              name, params = v.infobox(text or "")
              print("===", t, "->", title, "|", name, "|", {k: params.get(k) for k in ("stratagem_type", "traits", "source", "permit_type", "base_cooldown")})
          PY
      - name: Build wiki catalog
        run: python3 sync/verify_wiki.py --catalog
      - name: Commit catalog back to this branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
        run: |
          git config user.name "warmind data bot"; git config user.email "actions@github.com"
          git add sync/wiki_catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "data-verify: refresh wiki catalog"
          git push
