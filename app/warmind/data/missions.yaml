# Static mission catalog. The war APIs expose planets and campaigns, never the
# per-planet mission pool — that is resolved client-side at operation select.
#
# STATUS: VERIFIED against helldivers.wiki.gg/wiki/Missions (oldid 127925,
# last edited 2026-08-09) on 2026-08-11.
#
# Verified fields:   id, display_name, factions, difficulty_min, difficulty_max
# Editorial fields:  archetype, duration_band, tags  (kit-advisor taxonomy, not game data)
#
# Difficulty scale: 1 Trivial, 2 Easy, 3 Medium, 4 Challenging, 5 Hard,
#                   6 Extreme, 7 Suicide, 8 Impossible, 9 Helldive, 10 Super Helldive
#
# difficulty_max is load-bearing and was absent from the previous scaffold. Several
# missions never appear at high difficulty at all — every Eliminate mission caps out
# at 6 or below, so none of them can occur in a Super Helldive operation. Filtering on
# difficulty_min alone will surface missions that cannot be played.
#
# Tactical (optional) objectives live in tactical_objectives.yaml. Several of them —
# Stratagem Jammer, Gunship Facility, Detector Tower, Anti-Air Emplacement — shape a
# kit more than the primary objective does.
#
# Missions whose display_name is shared across factions (Blitz Search And Destroy)
# carry a faction-suffixed id, because their difficulty gates differ: Terminid opens
# at Easy, Automaton not until Medium.

