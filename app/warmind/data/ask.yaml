# What each item ASKS of the diver carrying it: 0 = forgiving (it covers mistakes),
# 1 = punishing (it only pays off when played well). Challenge and D100 lean towards
# high-ask kit that still answers the mission; the "why" line names the reason.
#
# Weapons (primaries / secondaries) are rated from their wiki stats instead
# (handling.py: recoil, rate of fire, magazine). This table covers stratagems,
# grenades and armour. Items not listed take their category's default.
#
# reasons (each has a translated phrase, why.ask.<reason>):
#   precision    every shot has to land on a weak spot
#   timing       a delay before it lands: lead the target, read the fight
#   danger_close big splash: it kills you or the squad if you're careless
#   stance       reloads or sets up standing still: pick your moment
#   charge       has to charge or spin up before it fires
#   heat         overheats or runs dry if you don't pace it
#   close        only works up close: you have to get in
#   setup        pays off only if it's placed before the fight
#   few          few uses: a wasted one hurts
#   mobile       only pays off if you use it to reposition
#   crutch       forgiving: it covers mistakes (Challenge steers away from it)
#   fragile      light armour: one mistake and you're down

