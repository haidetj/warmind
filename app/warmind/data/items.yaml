# WARMIND item dataset.
#
# Each item carries THREE things the resolver needs:
#   coverage : the baseline-capability axes it answers  {at, st, ch, bc}
#              at=heavy armour  st=structures  ch=chaff  bc=break contact
#   tags     : kit tags in the CLOSED modifier vocabulary (hazards.yaml +
#              mission_tag_modifiers.yaml). These are what the pressure vector
#              multiplies against. Editorial, but drawn from the fixed 28-tag set.
#   grade    : provisional meta tier per faction {S,A,B,C,D}. PROVISIONAL — the
#              u.gg parser (roadmap step 1) replaces these with two-source-verified
#              grades. base_grade contributes to score; until then it is a gentle
#              prior, deliberately small next to the pressure sum. Never a model fit.
#
# slot: primary | secondary | grenade | stratagem
# for stratagems, category: support | backpack | eagle | orbital | sentry |
#                           emplacement | mine | relay
# backpack: true if it occupies the backpack slot (max one per diver)
#
# Provenance: hand-authored from skill/references/loadout-library.md + roll.py,
# mid-2026 equipment. Grades are judgement, tags are judgement within a fixed set.

