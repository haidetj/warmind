# Boosters: chosen for four-unique-per-squad. role_bias steers who carries which.
boosters:
  - {name: "Hellpod Space Optimization", effect: "Drop in with full ammo/grenades/stims",      role_bias: any,       strong: true}
  - {name: "Vitality Enhancement",       effect: "Reduces damage taken, injury chance",         role_bias: hardpoint, strong: true}
  - {name: "Stamina Enhancement",        effect: "Higher max stamina, faster regen",            role_bias: forward,   strong: true}
  - {name: "Muscle Enhancement",         effect: "Traverse difficult terrain, resist slows",    role_bias: forward,   strong: true}
  - {name: "Experimental Infusion",      effect: "Stims speed-boost and briefly grant resist",  role_bias: hammer,    strong: false}
  - {name: "Motivational Shocks",        effect: "Shorten stagger/status from hits",            role_bias: hardpoint, strong: false}
  - {name: "Firebomb Hellpods",          effect: "Reinforce pods explode on landing",           role_bias: fires,     strong: false}
  - {name: "Localization Confusion",     effect: "Delays and reduces enemy patrol spawns",      role_bias: forward,   strong: false}
  - {name: "UAV Recon Booster",          effect: "Widens the radar sweep radius",               role_bias: forward,   strong: false}
  - {name: "Increased Reinforcement Budget", effect: "More reinforcements for the squad",       role_bias: any,       strong: false}
  - {name: "Flexible Reinforcement Budget",  effect: "Front-loads reinforcements",              role_bias: any,       strong: false}
  - {name: "Dead Sprint",                effect: "Sprint at the cost of health",                role_bias: forward,   strong: false}
  - {name: "Sample Scanner",             effect: "Marks nearby samples on the map",             role_bias: forward,   strong: false}
  - {name: "Stun Pods",                  effect: "Reinforce pods stun on landing",              role_bias: hammer,    strong: false}
