  - {name: "Hellpod Space Optimization", effect: "Drop in with full ammo/grenades/stims",      role_bias: any,       strong: true}
  - {name: "Vitality Enhancement",       effect: "Reduces damage taken, injury chance",         role_bias: hardpoint, strong: true}
  - {name: "Stamina Enhancement",        effect: "Higher max stamina, faster regen",            role_bias: forward,   strong: true}
  - {name: "Muscle Enhancement",         effect: "Traverse difficult terrain, resist slows",    role_bias: forward,   strong: true}
