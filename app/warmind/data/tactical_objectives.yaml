- id: to_stratagem_jammer
  display_name: "Stratagem Jammer"
  faction: automatons
  difficulty_min: 4
  difficulty_max: 10
  kit_impact: mandates
  tags: [structure_demo, hellbomb, no_stratagem_support]
  note: >
    Disables all stratagems inside its radius, including the hellbomb needed to destroy
    it unless a fabricator is co-located. Functionally a localised Ion Storm — the same
    inversion applies: what you are carrying is what you have. A squad with no support
    weapon and no primary damage cannot clear this.
  verified: true

- id: to_anti_air_emplacement
  display_name: "Anti-Air Emplacement"
  faction: automatons
