# Tactical (optional) objectives. Up to five spawn per map depending on difficulty.
#
# STATUS: VERIFIED against helldivers.wiki.gg/wiki/Missions (oldid 127925,
# last edited 2026-08-09) on 2026-08-11.
#
# Verified fields:   id, display_name, faction, difficulty_min, difficulty_max
# Editorial fields:  kit_impact, tags
#
# These matter more to a kit than the primary objective does. A Stratagem Jammer
# forces the same problem Ion Storms do — everything you called is unavailable inside
# its radius, and the only way to remove it is a hellbomb or a support weapon. A
# Gunship Facility mandates an anti-air answer regardless of what the mission is.
#
# kit_impact is the flag the resolver should key on. `mandates` = the squad needs the
# tagged capability or the objective cannot be cleared. `rewards` = it makes the drop
# materially easier. `none` = no kit consequence, purely a detour.
#
# faction 'super_earth' entries are friendly assets to activate, not enemy structures.

