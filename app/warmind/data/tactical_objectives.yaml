  difficulty_max: 10
  kit_impact: mandates
  tags: [structure_demo, hellbomb, blocks_eagle]
  note: >
    Blocks Eagle stratagems across a wide radius while active. Eagle-heavy loadouts lose
    their primary tool until it is destroyed, which makes clearing it a priority rather
    than a detour.
  verified: true

