# ---- planet conditions (the Gloom) ----
- id: light_gloom_cover
  group: planet
  display_name: "Light Gloom Cover"
  faction: any
  difficulty_min: 1
  description: "Gloom particles interfere with landing Pelicans, increasing extraction times by 20 seconds."
  modifiers: {sentry: +0.10, sustain_fire: +0.10}
  note: "Extraction takes 20s longer: save a strike and a sentry for the extraction hold."
  source: https://helldivers.wiki.gg/wiki/Effects
- id: moderate_gloom_blanket
  group: planet
  display_name: "Moderate Gloom Blanket"
  faction: any
  difficulty_min: 1
  description: "Extraction times increased by 30 seconds and Eagle re-arm time by 20%."
  modifiers: {eagle: -0.30, orbital: +0.20, sentry: +0.10}
  note: "Extraction +30s and Eagles re-arm 20% slower: lean on orbitals."
  source: https://helldivers.wiki.gg/wiki/Effects
- id: gloom_source
  group: planet
  display_name: "Gloom Source (Hive World)"
